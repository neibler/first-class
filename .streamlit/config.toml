[theme]
base = "light"
primaryColor = "#2f6fed"
backgroundColor = "#f3f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b2a41"
borderColor = "#dbe3ee"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
baseFontSize = 14
headingFontSizes = ["27px", "19px", "16px", "15px", "14px", "13px"]
chartCategoricalColors = ["#2f6fed", "#19b8a6", "#f2a33a", "#8b6fe8", "#e86a5c", "#7d8ea3"]

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
