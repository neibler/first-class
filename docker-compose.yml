name: first-class

services:
  api:
    build:
      context: .
      target: api
    # 성능 분석 결과를 /performance 로 서빙하려면 결과 폴더를 마운트한다.
    # 분석은 컨테이너 밖에서 실행하고, 생성된 폴더를 RESULTS_DIR 경로에 붙인다.
    #   python -m backend.performance.run_analysis ... --output results
    # volumes:
    #   - ./results:/results:ro
    environment:
      RESULTS_DIR: /results
      # Optional: read from the root .env. Without a key, /research says the key
      # is missing; the rest of the dashboard does not need it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEWS_CHROMA_PATH: /news/chroma
    volumes:
      # News DB copy prepared by news-db-init (fast Linux volume).
      - news-chroma:/news/chroma
    depends_on:
      news-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Copies the Git-excluded news DB (~1.4GB) into a Docker volume once, and again
  # only when chroma.sqlite3 changes. Opening it straight from a Windows folder
  # took ~40s per request; from the volume ~2s. Set NEWS_CHROMA_HOST_PATH in .env
  # when the DB lives elsewhere. Without a DB, /research reports it is missing.
  # A failed copy exits 1 so api does not start on a partial DB. A missing source
  # clears the old copy (exit 0) so api starts and reports the DB as missing.
  news-db-init:
    build:
      context: .
      target: api
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -f /source/chroma.sqlite3 ]; then
        stamp=$$(stat -c %s-%Y /source/chroma.sqlite3);
        if [ "$$(cat /news/chroma/.source 2>/dev/null)" != "$$stamp" ]; then
        echo "copying news DB"; rm -rf /news/chroma/* /news/chroma/.source;
        if ! cp -a /source/. /news/chroma/; then echo "news DB copy failed"; exit 1; fi;
        echo "$$stamp" > /news/chroma/.source;
        else echo "news DB up to date"; fi;
        else echo "news DB not found; clearing old copy, AI assistant will report it";
        rm -rf /news/chroma/* /news/chroma/.source; fi;
        chown -R 10001:10001 /news/chroma
    volumes:
      - ${NEWS_CHROMA_HOST_PATH:-./data/processed/news/chroma}:/source:ro
      - news-chroma:/news/chroma
    restart: "no"

  dashboard:
    build:
      context: .
      target: dashboard
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  news-chroma:
