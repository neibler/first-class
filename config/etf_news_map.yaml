# =============================================================
# ETF ↔ 뉴스 매핑 설정 (초안 v0.1)
# 담당: 뉴스 AI / 기준일: 2026-10-06
# -------------------------------------------------------------
# 용도
#   1) 기사 필터링: 기사가 어떤 ETF와 관련 있는지 판별
#   2) risk_score 계산: 기사 점수 × 관련도(편입 비중 또는 노출도)
#
# 매핑 방식
#   track A  편입종목 기반 — 기사에 편입 기업이 나오면 해당 ETF에 연결
#            관련도 = 편입 비중 (원래 값 그대로 저장, 정규화는 스코어링 단계에서)
#   track B  키워드 기반   — 편입 주식이 없는 채권·원자재 ETF
#   (공통)   위험유형 전파 — 기사에서 판정된 risk_type을 risk_exposure로 각 ETF에 분배
#
# 주의
#   - holdings는 기준일 스냅샷이다. 2019년~ 과거 구간에 그대로 쓰면 미래정보 누수
#     → SEC N-PORT(분기별 보유내역)로 연도별 보정 예정. 미보정 시 리포트 한계점에 기술
#   - risk_exposure 값은 이론 기반 초기값 → 과거 수익률과의 상관으로 보정 예정
# =============================================================

version: "0.1"
as_of: "2026-10-06"
holdings_source: "yfinance Ticker.funds_data.top_holdings"

# 팀 공통 규칙 4번의 risk_type 10종
risk_types: [recession, inflation, interest_rate, regulation, geopolitical,
             earnings, market_risk, credit_risk, commodity_risk, currency_risk]

# -------------------------------------------------------------
# 기사 매칭 규칙
# -------------------------------------------------------------
matching:
  word_boundary: true     # "Intel"이 "Intelligence"에 걸리지 않게
  case_sensitive: true    # "Public Storage"(기업) vs "public storage"(일반명사)
  # V, O, KO 같은 짧은 티커 오탐 방지: 티커는 아래 형식으로 나올 때만 인정 (TICKER = 실제 티커)
  ticker_forms: ["$TICKER", "(NASDAQ: TICKER)", "(NYSE: TICKER)", "(Nasdaq: TICKER)"]

# -------------------------------------------------------------
# 편입 기업 별칭 (여러 ETF가 공유. 예: NVDA → SPY·QQQ·SMH)
#   aliases : 기사에서 찾을 이름
#   exclude : 이름이 같은 다른 대상 (오탐 방지)
#   foreign : 해외 기업 → SEC 8-K 대상 아님 (6-K/현지 공시)
#   sec_cik : 티커가 가리키는 SEC 등록번호가 2019~2025년 공시 주체와 다를 때 직접 지정
# -------------------------------------------------------------
companies:
  # --- 빅테크 / 반도체 ---
  NVDA:  {name: "NVIDIA Corp", aliases: [Nvidia, NVIDIA]}
  AAPL:  {name: "Apple Inc", aliases: [Apple]}
  MSFT:  {name: "Microsoft Corp", aliases: [Microsoft]}
  AMZN:  {name: "Amazon.com Inc", aliases: [Amazon, Amazon.com, AWS], exclude: [Amazon rainforest]}
  GOOGL: {name: "Alphabet Inc", aliases: [Alphabet, Google]}
  META:  {name: "Meta Platforms Inc", aliases: [Meta Platforms, Facebook]}
  AVGO:  {name: "Broadcom Inc", aliases: [Broadcom]}
  TSLA:  {name: "Tesla Inc", aliases: [Tesla]}
  MU:    {name: "Micron Technology Inc", aliases: [Micron]}
  AMD:   {name: "Advanced Micro Devices Inc", aliases: [AMD, Advanced Micro Devices]}
  TSM:   {name: "Taiwan Semiconductor Manufacturing", aliases: [TSMC, Taiwan Semiconductor], foreign: true}
  AMAT:  {name: "Applied Materials Inc", aliases: [Applied Materials]}
  INTC:  {name: "Intel Corp", aliases: [Intel]}
  TXN:   {name: "Texas Instruments Inc", aliases: [Texas Instruments]}
  KLAC:  {name: "KLA Corp", aliases: [KLA Corp, KLA Corporation]}
  ASML:  {name: "ASML Holding NV", aliases: [ASML], foreign: true}   # SMH는 ADR, EFA는 암스테르담 상장분 보유
  QCOM:  {name: "Qualcomm Inc", aliases: [Qualcomm]}

  # --- 배당 / 방어 ---
  PG:    {name: "Procter & Gamble Co", aliases: ["Procter & Gamble", "P&G"]}
  MRK:   {name: "Merck & Co Inc", aliases: [Merck], exclude: [Merck KGaA]}
  KO:    {name: "Coca-Cola Co", aliases: [Coca-Cola]}
  AMGN:  {name: "Amgen Inc", aliases: [Amgen]}
  UNH:   {name: "UnitedHealth Group Inc", aliases: [UnitedHealth]}
  PEP:   {name: "PepsiCo Inc", aliases: [PepsiCo]}
  VZ:    {name: "Verizon Communications Inc", aliases: [Verizon]}

  # --- 에너지 ---
  # SEC 티커 XOM은 2026년 신설 지주회사(CIK 2115436)로 옮겨감. 2019~2025 8-K는 Exxon Mobil Corp
  XOM:   {name: "ExxonMobil", aliases: [Exxon, ExxonMobil, Exxon Mobil], sec_cik: 34088}
  CVX:   {name: "Chevron Corp", aliases: [Chevron]}
  COP:   {name: "ConocoPhillips", aliases: [ConocoPhillips]}
  VLO:   {name: "Valero Energy Corp", aliases: [Valero]}
  MPC:   {name: "Marathon Petroleum Corp", aliases: [Marathon Petroleum], exclude: [Marathon Oil]}
  PSX:   {name: "Phillips 66", aliases: [Phillips 66]}
  WMB:   {name: "Williams Companies Inc", aliases: [Williams Companies, Williams Cos]}
  SLB:   {name: "SLB", aliases: [SLB, Schlumberger]}
  EOG:   {name: "EOG Resources Inc", aliases: [EOG Resources]}
  KMI:   {name: "Kinder Morgan Inc", aliases: [Kinder Morgan]}

  # --- 해외 선진국 (EFA) ---
  HSBA.L:  {name: "HSBC Holdings PLC", aliases: [HSBC], foreign: true}
  ROP.SW:  {name: "Roche Holding AG", aliases: [Roche], foreign: true}
  SHEL.L:  {name: "Shell PLC", aliases: [Shell plc, Royal Dutch Shell, "Shell's"], exclude: [shell company, shell companies], foreign: true}
  NOVN.SW: {name: "Novartis AG", aliases: [Novartis], foreign: true}
  "8306.T": {name: "Mitsubishi UFJ Financial Group", aliases: [Mitsubishi UFJ, MUFG], foreign: true}
  AZN.L:   {name: "AstraZeneca PLC", aliases: [AstraZeneca], foreign: true}
  NESN.SW: {name: "Nestle SA", aliases: [Nestle, Nestlé], foreign: true}
  SIE.DE:  {name: "Siemens AG", aliases: [Siemens], exclude: [Siemens Energy, Siemens Healthineers], foreign: true}
  BHP.AX:  {name: "BHP Group Ltd", aliases: [BHP], foreign: true}

  # --- 리츠 (VNQ) ---
  WELL:  {name: "Welltower Inc", aliases: [Welltower]}
  PLD:   {name: "Prologis Inc", aliases: [Prologis]}
  EQIX:  {name: "Equinix Inc", aliases: [Equinix]}
  AMT:   {name: "American Tower Corp", aliases: [American Tower]}
  SPG:   {name: "Simon Property Group Inc", aliases: [Simon Property]}
  DLR:   {name: "Digital Realty Trust Inc", aliases: [Digital Realty]}
  O:     {name: "Realty Income Corp", aliases: [Realty Income]}
  PSA:   {name: "Public Storage", aliases: [Public Storage]}
  # 2026-08 Equity Residential에서 사명 변경 (SEC CIK 906107 동일). 과거 기사는 옛 이름으로 나옴
  VMRK:  {name: "Vivmark Residential", aliases: [Vivmark, Equity Residential]}

# -------------------------------------------------------------
# ETF별 매핑 (팀 공통 규칙 2번 순서 고정)
#   holdings      : 상위 편입종목 비중 (0~1). 현금성 펀드(XTSLA, AGPXX 등)·내부 펀드(VRTPX)는 제외
#   keywords      : ETF 직접 관련 키워드 (track B는 이것이 주 매칭 수단)
#   nyt_tags      : (선택) NYT 기사 태그와 정확히 일치하면 연결. GDELT 검색어에는 쓰지 않음
#   risk_exposure : 해당 위험이 커질 때 이 ETF에 불리한 정도 (0~1) → risk_score에 반영
#   hedge_for     : 해당 위험이 커질 때 오히려 수혜인 위험유형 → risk_score에는 반영하지 않고
#                   대시보드 설명용 (예: "경기침체 태그 증가 → TLT 비중 확대 이유")
# -------------------------------------------------------------
