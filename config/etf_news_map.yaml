# -------------------------------------------------------------
# risk_type별 1차 필터 키워드 (LLM 태깅 전에 비용 절감용 / GDELT 검색어로도 사용)
# 최종 risk_type 판정은 LLM이 한다
# -------------------------------------------------------------
risk_type_keywords:
  recession:      [recession, economic slowdown, GDP contraction, layoffs, jobless claims,
                   unemployment rate, hard landing, consumer spending falls]
  inflation:      [inflation, CPI, PCE, price pressures, sticky inflation, wage growth,
                   inflation expectations]
  interest_rate:  [Federal Reserve, FOMC, rate hike, rate cut, Treasury yields, hawkish,
                   dovish, Fed chair, bond yields, interest rates]
  regulation:     [antitrust, export controls, tariff, tariffs, regulators, SEC probe, FTC,
                   Justice Department, export ban, import ban, new rules]
  geopolitical:   [war, invasion, missile, sanctions, military conflict, Middle East,
                   Taiwan Strait, ceasefire, embargo]
  earnings:       [earnings miss, guidance cut, profit warning, lowers forecast,
                   revenue decline, quarterly results, misses estimates]
  market_risk:    [selloff, sell-off, stocks plunge, VIX, volatility spike, market crash,
                   market correction, bear market, rout]
  credit_risk:    [debt default, default risk, debt downgrade, rating downgrade, credit spreads,
                   bankruptcy,
                   Chapter 11, junk bonds,
                   distressed debt, credit crunch]
  commodity_risk: [oil prices, OPEC, supply disruption, crude, copper prices, crop failure,
                   drought, commodity prices, shortage]
  currency_risk:  [dollar index, dollar surges, strong dollar, yen, euro, currency,
                   forex, devaluation, exchange rate]
